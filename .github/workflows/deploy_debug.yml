# .github/workflows/deploy.yml
name: Debug site build workflow

on:
  push:
    branches:
      - '**'

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'  # Match the Go version you use locally

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      # Install Hugo (extended)
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Install other dependencies
        run: |
          sudo apt update && sudo apt install rsync

      - name: Build site
        run: |
          hugo mod get -u
          npm clean-install
          hugo --minify
